
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<title>채팅 페이지</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    font-family: "Malgun Gothic", Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 15px;
}

/* 채팅 전체 영역 */
.chat-container {
    width: 750px;
    height: 720px;
    max-width: 100%;
    background: #f4f4f4;
    border-radius: 32px;
    display: flex;
    flex-direction: column;
    padding: 40px 32px 32px;
    overflow: hidden;
}

/* 상단 제목 */
.chat-header {
    font-size: 25px;
    font-weight: bold;
    color: #333;
    margin-bottom: 32px;
}

/* 메시지 영역 */
.chat-body {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
    padding-bottom: 15px;
}

/* 메시지 공통 */
.message-row {
    display: flex;
    align-items: flex-start;
    gap: 15px;
    width: 100%;
}

.message-row.outgoing {
    justify-content: flex-end;
}

/* 프로필 */
.profile {
    width: 49px;
    height: 49px;
    min-width: 49px;
    border-radius: 50%;
    background: #d8e3f3;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-size: 22px;
    color: #315e9e;
    font-weight: bold;
}

.profile img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* 메시지 말풍선 */
.bubble {
    max-width: 360px;
    background: white;
    color: #111;
    padding: 16px 28px;
    border-radius: 32px;
    font-size: 20px;
    line-height: 1.5;
    word-break: break-word;
}

.bubble .mention {
    color: #168cff;
}

/* 사용자 메시지 */
.outgoing .bubble {
    background: #3498f7;
    color: white;
    text-align: center;
    padding: 15px 28px;
}

/* 이미지 메시지 */
.image-message {
    display: flex;
    justify-content: flex-end;
    margin-top: -2px;
}

.image-message img {
    width: 96px;
    height: 96px;
    object-fit: cover;
    border-radius: 20px;
    cursor: pointer;
}

/* 파일 메시지 */
.file-message {
    display: flex;
    justify-content: flex-end;
}

.file-bubble {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #3498f7;
    color: white;
    border-radius: 32px;
    padding: 15px 27px;
    font-size: 20px;
    cursor: pointer;
    max-width: 100%;
}

.file-icon {
    font-size: 27px;
}

.file-bubble a {
    color: white;
    text-decoration: none;
    overflow-wrap: anywhere;
}

/* 입력 영역 */
.chat-footer {
    width: 100%;
    height: 80px;
    min-height: 80px;
    background: white;
    border-radius: 17px;
    display: flex;
    align-items: center;
    padding: 10px 16px;
    gap: 10px;
}

.chat-footer input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    font-size: 21px;
    color: #333;
    background: transparent;
}

.chat-footer input::placeholder {
    color: #444;
}

/* 파일 첨부 버튼 */
.attach-btn {
    display: none;
}

/* 전송 버튼 */
.send-btn {
    width: 48px;
    height: 48px;
    min-width: 48px;
    border: none;
    border-radius: 50%;
    background: #3498f7;
    color: white;
    font-size: 28px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

.send-btn:hover {
    background: #167bd8;
}

/* 새 메시지 애니메이션 */
.message-row {
    animation: showMessage 0.2s ease;
}

@keyframes showMessage {
    from {
        opacity: 0;
        transform: translateY(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* 스크롤바 */
.chat-body::-webkit-scrollbar {
    width: 4px;
}

.chat-body::-webkit-scrollbar-thumb {
    background: #ccc;
    border-radius: 10px;
}

/* 모바일 */
@media(max-width: 550px) {
    body {
        padding: 0;
        align-items: stretch;
    }

    .chat-container {
        width: 100%;
        height: 100dvh;
        border-radius: 0;
        padding: 30px 20px 20px;
    }

    .chat-header {
        font-size: 22px;
    }

    .bubble {
        font-size: 17px;
        padding: 14px 20px;
    }

    .outgoing .bubble,
    .file-bubble {
        font-size: 17px;
        padding: 13px 20px;
    }

    .chat-footer input {
        font-size: 17px;
    }
}
</style>
</head>

<body>

<div class="chat-container">

    <!-- 상단 제목 -->
    <div class="chat-header">
        # 즐거움이 있는 여행, 물어봐!
    </div>

    <!-- 채팅 메시지 영역 -->
    <div class="chat-body" id="chatBody">

        <!-- 상대방 메시지 -->
        <div class="message-row incoming">

            <div class="profile">
                여행
            </div>

            <div class="bubble">
                <span class="mention">@여행비서</span> 안녕하세요,<br>
                경주 여행 가이드 알려주세요.
            </div>

        </div>

        <!-- 사용자 메시지 -->
        <div class="message-row outgoing">

            <div class="bubble">
                여행 가이드 설명서를 첨부 해 드립니다. 경주소개 시작됩니다.
            </div>

        </div>

        <!-- 이미지 첨부 -->
        <div class="message-row outgoing">

            <div class="image-message">
                <img
                    src="https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?w=300"
                    alt="매장 전시 이미지"
                    onclick="window.open(this.src)"
                >
            </div>

        </div>

        <!-- PDF 첨부 -->
        <div class="message-row outgoing">

            <div class="file-bubble"
                 onclick="alert('PDF 파일을 연결해 주세요.')">

                <span class="file-icon">📄</span>
                <span>매장 전시 가이드.pdf</span>

            </div>

        </div>

    </div>

    <!-- 메시지 입력 -->
    <div class="chat-footer">

        <input
            type="text"
            id="messageInput"
            placeholder="궁금한 점은 문의주세요."
            autocomplete="off"
        >

        <!-- 파일 첨부 -->
        <input
            type="file"
            id="fileInput"
            class="attach-btn"
            accept="image/*,.pdf"
        >

        <button class="send-btn" onclick="sendMessage()">
            ✓
        </button>

    </div>

</div>

<script>

// 메시지 전송
function sendMessage() {

    const input = document.getElementById("messageInput");
    const chatBody = document.getElementById("chatBody");

    const message = input.value.trim();

    if (message === "") {
        return;
    }

    // 메시지 행 생성
    const row = document.createElement("div");
    row.className = "message-row outgoing";

    // 말풍선 생성
    const bubble = document.createElement("div");
    bubble.className = "bubble";

    // 사용자 입력을 안전하게 텍스트로 출력
    bubble.textContent = message;

    row.appendChild(bubble);

    // 채팅 영역에 추가
    chatBody.appendChild(row);

    // 입력창 초기화
    input.value = "";

    // 마지막 메시지로 스크롤
    chatBody.scrollTop = chatBody.scrollHeight;

}


// Enter 키 전송
document.getElementById("messageInput")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            sendMessage();
        }

    });

</script>

</body>
</html>
